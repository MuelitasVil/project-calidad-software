<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - ORGSECURE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Page Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Gestión de Usuarios</h1>
            <p class="text-gray-600">Registra y administra usuarios del sistema</p>
        </div>

        <!-- Tabs -->
        <div class="bg-white rounded-lg shadow-md mb-6">
            <div class="border-b border-gray-200">
                <nav class="flex -mb-px">
                    <button id="tabRegister" class="tab-button active px-6 py-3 font-medium text-sm border-b-2 border-blue-600 text-blue-600">
                        <i data-feather="user-plus" class="inline h-4 w-4 mr-2"></i>
                        Registrar Usuario
                    </button>
                    <button id="tabList" class="tab-button px-6 py-3 font-medium text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        <i data-feather="list" class="inline h-4 w-4 mr-2"></i>
                        Lista de Usuarios
                    </button>
                </nav>
            </div>
        </div>

        <!-- Register Form Tab -->
        <div id="registerTab" class="tab-content">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">Registrar Nuevo Usuario</h2>
                
                <form id="registerForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Email -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="mail" class="inline h-4 w-4"></i>
                                Correo Institucional UNAL *
                            </label>
                            <input type="email" id="email_unal" required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="usuario@unal.edu.co">
                        </div>

                        <!-- Password -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="lock" class="inline h-4 w-4"></i>
                                Contraseña *
                            </label>
                            <input type="password" id="password" required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Contraseña">
                        </div>

                        <!-- Rol -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="shield" class="inline h-4 w-4"></i>
                                Rol *
                            </label>
                            <select id="type_user" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">Seleccionar rol</option>
                                <option value="student">Estudiante</option>
                                <option value="professor">Profesor</option>
                                <option value="guest">Invitado</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>

                        <!-- Document -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="credit-card" class="inline h-4 w-4"></i>
                                Documento de Identidad
                            </label>
                            <input type="text" id="document"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="123456789">
                        </div>

                        <!-- Name -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="user" class="inline h-4 w-4"></i>
                                Nombre
                            </label>
                            <input type="text" id="name"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Juan">
                        </div>

                        <!-- Lastname -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="user" class="inline h-4 w-4"></i>
                                Apellido
                            </label>
                            <input type="text" id="lastname"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Pérez">
                        </div>

                        <!-- Full Name -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="users" class="inline h-4 w-4"></i>
                                Nombre Completo
                            </label>
                            <input type="text" id="full_name"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Juan Pérez García">
                        </div>

                        <!-- Gender -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="user-check" class="inline h-4 w-4"></i>
                                Género
                            </label>
                            <select id="gender"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">Seleccionar</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                                <option value="O">Otro</option>
                            </select>
                        </div>

                        <!-- Birth Date -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="calendar" class="inline h-4 w-4"></i>
                                Fecha de Nacimiento
                            </label>
                            <input type="date" id="birth_date"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="flex gap-3 pt-4">
                        <button type="submit" 
                                class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2 font-medium">
                            <i data-feather="save" class="h-5 w-5"></i>
                            <span>Registrar Usuario</span>
                        </button>
                        <button type="reset" 
                                class="px-6 py-3 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition-colors flex items-center gap-2">
                            <i data-feather="x" class="h-5 w-5"></i>
                            <span>Limpiar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- List Tab -->
        <div id="listTab" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold text-gray-800">Lista de Usuarios Registrados</h2>
                    <button id="refreshBtn" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                        <i data-feather="refresh-cw" class="h-4 w-4"></i>
                        <span>Actualizar</span>
                    </button>
                </div>

                <!-- Search Bar -->
                <div class="mb-4">
                    <div class="relative">
                        <i data-feather="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400"></i>
                        <input type="text" id="searchInput" 
                               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Buscar por email, nombre o documento...">
                    </div>
                </div>

                <!-- Users Table -->
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre Completo</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Documento</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rol</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Género</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="px-6 py-4 text-center text-gray-500">
                                    <i data-feather="loader" class="inline h-5 w-5 animate-spin"></i>
                                    Cargando usuarios...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Info -->
                <div class="mt-4 text-sm text-gray-600 text-center" id="userCount">
                    Total: 0 usuarios
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-semibold text-gray-800">Editar Usuario</h2>
                    <button id="closeModal" class="text-gray-400 hover:text-gray-600">
                        <i data-feather="x" class="h-6 w-6"></i>
                    </button>
                </div>

                <form id="editForm" class="space-y-4">
                    <input type="hidden" id="edit_email_unal">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Email UNAL</label>
                            <input type="email" id="edit_email_display" disabled
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md bg-gray-100">
                        </div>

                        <!-- Rol -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="shield" class="inline h-4 w-4"></i>
                                Rol
                            </label>
                            <select id="edit_type_user"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                                <option value="student">Estudiante</option>
                                <option value="professor">Profesor</option>
                                <option value="guest">Invitado</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>

                        <!-- Nueva Contraseña -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i data-feather="lock" class="inline h-4 w-4"></i>
                                Nueva Contraseña (opcional)
                            </label>
                            <input type="password" id="edit_password"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                                   placeholder="Dejar en blanco para no cambiar">
                            <p class="text-xs text-gray-500 mt-1">Solo completa este campo si deseas cambiar la contraseña</p>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Documento</label>
                            <input type="text" id="edit_document"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
                            <input type="text" id="edit_name"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Apellido</label>
                            <input type="text" id="edit_lastname"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nombre Completo</label>
                            <input type="text" id="edit_full_name"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Género</label>
                            <select id="edit_gender"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                                <option value="">Seleccionar</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                                <option value="O">Otro</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Nacimiento</label>
                            <input type="date" id="edit_birth_date"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button type="submit" 
                                class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                            Guardar Cambios
                        </button>
                        <button type="button" id="cancelEdit" 
                                class="px-6 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition-colors">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="js/users-manager.js"></script>
    <script>
        // Check authentication and admin role
        if (!Navbar.checkAuth()) {
            window.location.href = 'login.html';
        }

        // Check if user is admin
        let userData = {};
        try {
            const userStr = localStorage.getItem('user') || '{}';
            userData = JSON.parse(userStr);
            
            if (!userData.type_user || userData.type_user.toLowerCase() !== 'admin') {
                alert('Acceso denegado. Solo administradores pueden acceder a esta página.');
                window.location.href = 'dashboard.html';
            }
        } catch (e) {
            console.error('Error parsing user data:', e);
            window.location.href = 'login.html';
        }

        // Initialize components
        const navbar = new Navbar();
        navbar.render('navbar-container', { currentPage: 'users' });

        const footer = new Footer();
        footer.render('footer-container');

        // Initialize Feather icons
        feather.replace();
    </script>
</body>
</html>
