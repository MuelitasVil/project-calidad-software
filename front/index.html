<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORGSECURE - Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/footer.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    
    <!-- Hero Section -->
    <div class="flex-grow flex flex-col items-center justify-center px-4">
        <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full text-center">
            <div class="mb-6">
                <img src="logo-o.png" alt="Logo ORGSECURE" class="h-16 w-auto mx-auto mb-4">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">ORGSECURE</h1>
                <p class="text-gray-600">Sistema de Gestión Académica</p>
            </div>
            
            <div class="mb-6 text-left space-y-3 text-sm text-gray-600">
                <div class="flex items-center gap-2">
                    <i data-feather="check-circle" class="h-4 w-4 text-green-600"></i>
                    <span>Gestión de períodos académicos</span>
                </div>
                <div class="flex items-center gap-2">
                    <i data-feather="check-circle" class="h-4 w-4 text-green-600"></i>
                    <span>Administración de usuarios</span>
                </div>
                <div class="flex items-center gap-2">
                    <i data-feather="check-circle" class="h-4 w-4 text-green-600"></i>
                    <span>Portal seguro y centralizado</span>
                </div>
            </div>

            <a href="login.html" class="inline-flex items-center gap-2 px-6 py-3 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition duration-150 w-full justify-center">
                <i data-feather="log-in" class="h-4 w-4"></i>
                <span>Iniciar Sesión</span>
            </a>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script>
        // Inicializar iconos
        feather.replace();

        // Renderizar footer
        const footer = new Footer();
        footer.render('footer-container', { theme: 'light', showLinks: false });
    </script>
</body>
</html>
