<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORGSECURE - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <script src="components/footer.js"></script>
  <style>
    /* Animación para el modal OTP */
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    .animate-fade-in {
      animation: fade-in 0.3s ease-out;
    }
    
    /* Estilo para inputs OTP */
    .otp-input:focus {
      outline: none;
    }
    
    .otp-input {
      caret-color: #7c3aed;
    }
    
    /* Quitar spinner de números en inputs */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
  
  <div class="flex-grow flex items-center justify-center px-4 py-8">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-2xl">
      <!-- Tabs -->
      <div class="border-b border-gray-200 mb-6">
        <nav class="flex -mb-px">
          <button id="tabLogin" class="tab-button active px-6 py-3 font-medium text-sm border-b-2 border-blue-600 text-blue-600">
            <i data-feather="log-in" class="inline h-4 w-4 mr-2"></i>
            Iniciar Sesión
          </button>
          <button id="tabRegister" class="tab-button px-6 py-3 font-medium text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
            <i data-feather="user-plus" class="inline h-4 w-4 mr-2"></i>
            Registrarse
          </button>
        </nav>
      </div>

      <!-- Login Tab -->
      <div id="loginTab" class="tab-content">
        <div class="text-center mb-8">
          <img src="logo-o.png" alt="ORGSECURE" class="mx-auto h-20 w-auto mb-4">
          <h1 class="text-2xl font-bold text-gray-800">Iniciar Sesión</h1>
          <p class="text-sm text-gray-600 mt-2">Sistema de Gestión Académica</p>
        </div>

        <form id="loginForm" class="space-y-4">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Usuario</label>
            <input type="text" id="username" name="username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm 
              focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
            <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm 
              focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <button type="submit" id="SignIn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm 
              text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none 
              focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
              Sign In
            </button>
          </div>

          <!-- Mensaje de error -->
          <div id="errorMessage" class="text-red-500 text-sm mt-2 text-center"></div>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
          <a href="index.html" class="text-blue-600 hover:text-blue-800 flex items-center justify-center gap-1">
            <i data-feather="arrow-left" class="h-4 w-4"></i>
            <span>Volver al inicio</span>
          </a>
        </div>
      </div>

      <!-- Register Tab -->
      <div id="registerTab" class="tab-content hidden">
        <div class="text-center mb-8">
          <img src="logo-o.png" alt="ORGSECURE" class="mx-auto h-20 w-auto mb-4">
          <h1 class="text-2xl font-bold text-gray-800">Registrarse como Invitado</h1>
          <p class="text-sm text-gray-600 mt-2">Completa el formulario para crear tu cuenta</p>
        </div>

        <form id="registerForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Email -->
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">
                <i data-feather="mail" class="inline h-4 w-4"></i>
                Correo Electrónico UNAL *
              </label>
              <input type="email" id="reg_email_unal" required
                     class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                     placeholder="usuario@unal.edu.co">
            </div>

            <!-- Password -->
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">
                <i data-feather="lock" class="inline h-4 w-4"></i>
                Contraseña *
              </label>
              <input type="password" id="reg_password" required
                     class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                     placeholder="Contraseña">
            </div>

            <!-- Confirm Password -->
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">
                <i data-feather="lock" class="inline h-4 w-4"></i>
                Confirmar Contraseña *
              </label>
              <input type="password" id="reg_password_confirm" required
                     class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                     placeholder="Confirmar contraseña">
              <p id="passwordMatchError" class="text-red-500 text-xs mt-1 hidden">Las contraseñas no coinciden</p>
            </div>

            <!-- Document -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                <i data-feather="credit-card" class="inline h-4 w-4"></i>
                Documento de Identidad
              </label>
              <input type="text" id="reg_document"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                     placeholder="123456789">
            </div>

            <!-- Name -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                <i data-feather="user" class="inline h-4 w-4"></i>
                Nombre
              </label>
              <input type="text" id="reg_name"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                     placeholder="Juan">
            </div>

            <!-- Lastname -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                <i data-feather="user" class="inline h-4 w-4"></i>
                Apellido
              </label>
              <input type="text" id="reg_lastname"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                     placeholder="Pérez">
            </div>

            <!-- Full Name -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                <i data-feather="users" class="inline h-4 w-4"></i>
                Nombre Completo
              </label>
              <input type="text" id="reg_full_name"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                     placeholder="Juan Pérez García">
            </div>

            <!-- Gender -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                <i data-feather="user-check" class="inline h-4 w-4"></i>
                Género
              </label>
              <select id="reg_gender"
                      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                <option value="">Seleccionar</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
                <option value="O">Otro</option>
              </select>
            </div>

            <!-- Birth Date -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                <i data-feather="calendar" class="inline h-4 w-4"></i>
                Fecha de Nacimiento
              </label>
              <input type="date" id="reg_birth_date"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
          </div>

          <!-- Contact Information Section -->
          <div class="mt-6 pt-6 border-t border-gray-200">
            <div id="registerContactsContainer"></div>
          </div>

          <!-- Submit Button -->
          <div class="flex gap-3 pt-4">
            <button type="submit" 
                    class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2 font-medium">
              <i data-feather="save" class="h-5 w-5"></i>
              <span>Registrarse</span>
            </button>
            <button type="reset" 
                    class="px-6 py-3 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition-colors flex items-center gap-2">
              <i data-feather="x" class="h-5 w-5"></i>
              <span>Limpiar</span>
            </button>
          </div>

          <!-- Mensaje de error/éxito -->
          <div id="registerMessage" class="text-sm mt-2 text-center"></div>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
          <a href="index.html" class="text-blue-600 hover:text-blue-800 flex items-center justify-center gap-1">
            <i data-feather="arrow-left" class="h-4 w-4"></i>
            <span>Volver al inicio</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal OTP -->
  <div id="otpModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full mx-4 animate-fade-in">
      <!-- Header -->
      <div class="text-center mb-6">
        <div class="mx-auto w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mb-4">
          <i data-feather="shield" class="w-8 h-8 text-purple-600"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Verificación de Seguridad</h2>
        <p class="text-sm text-gray-600">Ingresa el código de 6 dígitos que enviamos a tu correo</p>
        <p class="text-xs text-purple-600 font-medium mt-2" id="otpEmailDisplay"></p>
      </div>

      <!-- Formulario OTP -->
      <form id="otpForm" class="space-y-6">
        <!-- Inputs de 6 dígitos -->
        <div class="flex justify-center gap-2">
          <input type="text" id="otp1" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:ring focus:ring-purple-200 transition" />
          <input type="text" id="otp2" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:ring focus:ring-purple-200 transition" />
          <input type="text" id="otp3" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:ring focus:ring-purple-200 transition" />
          <input type="text" id="otp4" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:ring focus:ring-purple-200 transition" />
          <input type="text" id="otp5" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:ring focus:ring-purple-200 transition" />
          <input type="text" id="otp6" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:ring focus:ring-purple-200 transition" />
        </div>

        <!-- Temporizador -->
        <div class="text-center">
          <p class="text-sm text-gray-600">
            <i data-feather="clock" class="inline w-4 h-4"></i>
            El código expira en <span id="otpTimer" class="font-bold text-purple-600">5:00</span>
          </p>
        </div>

        <!-- Mensaje de error -->
        <div id="otpError" class="hidden text-red-600 text-sm text-center bg-red-50 border border-red-200 rounded-lg p-3">
          <i data-feather="alert-circle" class="inline w-4 h-4"></i>
          <span id="otpErrorMessage"></span>
        </div>

        <!-- Botones -->
        <div class="flex gap-3">
          <button type="button" id="cancelOtp" class="flex-1 px-4 py-3 border-2 border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition font-medium">
            <i data-feather="x" class="inline w-4 h-4 mr-1"></i>
            Cancelar
          </button>
          <button type="submit" id="verifyOtp" class="flex-1 px-4 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition font-medium">
            <i data-feather="check" class="inline w-4 h-4 mr-1"></i>
            Verificar
          </button>
        </div>

        <!-- Reenviar -->
        <div class="text-center">
          <button type="button" id="resendOtp" class="text-sm text-purple-600 hover:text-purple-800 font-medium">
            <i data-feather="refresh-cw" class="inline w-4 h-4"></i>
            ¿No recibiste el código? Reenviar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer Container -->
  <div id="footer-container"></div>

  <!-- Contact Manager Component -->
  <script src="js/contact-manager.js"></script>

  <script>
    const AUTH_API = 'http://localhost:8000';
    const USERS_API = 'http://localhost:8001';
    const CONTACTS_API = 'http://localhost:8001/contact_data';
    
    // Inicializar ContactManager para registro
    let registerContactManager;
    
    document.addEventListener('DOMContentLoaded', () => {
      registerContactManager = new ContactManager('registerContactsContainer', {
        showLabels: true,
        allowEmpty: true,
        minContacts: 0,
        maxContacts: 10
      });
      
      // Agregar un contacto vacío inicial
      registerContactManager.addContact();
    });

    // Tab switching
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active', 'border-blue-600', 'text-blue-600');
      tabLogin.classList.remove('border-transparent', 'text-gray-500');
      tabRegister.classList.remove('active', 'border-blue-600', 'text-blue-600');
      tabRegister.classList.add('border-transparent', 'text-gray-500');
      
      loginTab.classList.remove('hidden');
      registerTab.classList.add('hidden');
      
      feather.replace();
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active', 'border-blue-600', 'text-blue-600');
      tabRegister.classList.remove('border-transparent', 'text-gray-500');
      tabLogin.classList.remove('active', 'border-blue-600', 'text-blue-600');
      tabLogin.classList.add('border-transparent', 'text-gray-500');
      
      registerTab.classList.remove('hidden');
      loginTab.classList.add('hidden');
      
      feather.replace();
    });

    // Login form - Variables globales OTP
    let currentOtpEmail = '';
    let otpTimerInterval = null;
    
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = '';

      if (!username || !password) {
        errorDiv.textContent = '⚠️ Please enter both username and password.';
        return;
      }

      try {
        const endpoint = `${AUTH_API}/auth/login`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            e_mail: username,
            password: password
          })
        });

        if (!response.ok) {
          if (response.status === 401) {
            throw new Error('Invalid username or password.');
          }
          throw new Error(`Server error (${response.status})`);
        }

        const data = await response.json();
        console.log('Response:', data);

        // Si requiere OTP, mostrar modal
        if (data.requires_otp) {
          currentOtpEmail = data.email;
          showOtpModal(data.email, data.expires_in_minutes);
          errorDiv.classList.remove('text-red-500');
          errorDiv.classList.add('text-green-600');
          errorDiv.textContent = '✅ Código OTP enviado a tu correo';
          return;
        }

        // Login directo (sin OTP) - no debería pasar con la nueva implementación
        const user = data["Access Granted"];
        const token = data.Access_token;
        const typeUser = data.type_user || "user";

        if (!token || !user) {
          throw new Error('Invalid response: missing token or user.');
        }

        localStorage.setItem('authToken', token);
        localStorage.setItem('user', JSON.stringify({ 
          email: user, 
          username: user,
          type_user: typeUser
        }));

        errorDiv.classList.remove('text-red-500');
        errorDiv.classList.add('text-green-600');
        errorDiv.textContent = '✅ Login successful! Redirecting...';

        setTimeout(() => {
          window.location.href = 'home.html';
        }, 1000);

      } catch (error) {
        console.error('Login error:', error);
        errorDiv.classList.remove('text-green-600');
        errorDiv.classList.add('text-red-500');
        errorDiv.textContent = '❌ ' + (error.message || 'Login failed. Please try again.');
      }
    });

    // ==================== FUNCIONES OTP ====================
    
    function showOtpModal(email, expiresInMinutes = 5) {
      currentOtpEmail = email;
      document.getElementById('otpEmailDisplay').textContent = email;
      document.getElementById('otpModal').classList.remove('hidden');
      
      // Limpiar inputs
      for (let i = 1; i <= 6; i++) {
        document.getElementById(`otp${i}`).value = '';
      }
      document.getElementById('otp1').focus();
      
      // Limpiar error
      document.getElementById('otpError').classList.add('hidden');
      
      // Iniciar temporizador
      startOtpTimer(expiresInMinutes);
      
      // Reiniciar iconos
      feather.replace();
    }
    
    function hideOtpModal() {
      document.getElementById('otpModal').classList.add('hidden');
      clearInterval(otpTimerInterval);
      currentOtpEmail = '';
    }
    
    function startOtpTimer(minutes) {
      let timeLeft = minutes * 60; // Convertir a segundos
      const timerDisplay = document.getElementById('otpTimer');
      
      // Limpiar temporizador anterior si existe
      if (otpTimerInterval) {
        clearInterval(otpTimerInterval);
      }
      
      otpTimerInterval = setInterval(() => {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        
        if (timeLeft <= 0) {
          clearInterval(otpTimerInterval);
          timerDisplay.textContent = '0:00';
          showOtpError('El código ha expirado. Solicita uno nuevo.');
        }
        
        timeLeft--;
      }, 1000);
    }
    
    function showOtpError(message) {
      const errorDiv = document.getElementById('otpError');
      document.getElementById('otpErrorMessage').textContent = message;
      errorDiv.classList.remove('hidden');
      feather.replace();
    }
    
    function hideOtpError() {
      document.getElementById('otpError').classList.add('hidden');
    }
    
    // Auto-avanzar entre inputs OTP
    for (let i = 1; i <= 6; i++) {
      const input = document.getElementById(`otp${i}`);
      
      input.addEventListener('input', (e) => {
        const value = e.target.value;
        
        // Solo permitir números
        if (!/^\d$/.test(value) && value !== '') {
          e.target.value = '';
          return;
        }
        
        // Mover al siguiente input si hay valor
        if (value && i < 6) {
          document.getElementById(`otp${i + 1}`).focus();
        }
        
        hideOtpError();
      });
      
      // Manejar backspace
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 1) {
          document.getElementById(`otp${i - 1}`).focus();
        }
      });
    }
    
    // Verificar OTP
    document.getElementById('otpForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // Recopilar código OTP
      let otpCode = '';
      for (let i = 1; i <= 6; i++) {
        otpCode += document.getElementById(`otp${i}`).value;
      }
      
      if (otpCode.length !== 6) {
        showOtpError('Por favor ingresa los 6 dígitos del código');
        return;
      }
      
      try {
        const response = await fetch(`${AUTH_API}/auth/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            e_mail: currentOtpEmail,
            otp_code: otpCode
          })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.detail || 'Código OTP inválido');
        }
        
        // OTP verificado - guardar token y redirigir
        const token = data.Access_token;
        const user = data["Access Granted"];
        const typeUser = data.type_user;
        
        localStorage.setItem('authToken', token);
        localStorage.setItem('user', JSON.stringify({ 
          email: user, 
          username: user,
          type_user: typeUser
        }));
        
        hideOtpModal();
        
        // Mostrar mensaje de éxito
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.classList.remove('text-red-500');
        errorDiv.classList.add('text-green-600');
        errorDiv.textContent = '✅ Código verificado! Redirigiendo...';
        
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 1000);
        
      } catch (error) {
        console.error('OTP verification error:', error);
        showOtpError(error.message);
        
        // Limpiar inputs
        for (let i = 1; i <= 6; i++) {
          document.getElementById(`otp${i}`).value = '';
        }
        document.getElementById('otp1').focus();
      }
    });
    
    // Cancelar OTP
    document.getElementById('cancelOtp').addEventListener('click', function() {
      hideOtpModal();
    });
    
    // Reenviar OTP
    document.getElementById('resendOtp').addEventListener('click', async function() {
      if (!currentOtpEmail) return;
      
      try {
        this.disabled = true;
        this.textContent = 'Enviando...';
        
        const response = await fetch(`${AUTH_API}/auth/resend-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            e_mail: currentOtpEmail
          })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.detail || 'Error al reenviar código');
        }
        
        // Reiniciar temporizador
        startOtpTimer(data.expires_in_minutes);
        
        // Limpiar inputs
        for (let i = 1; i <= 6; i++) {
          document.getElementById(`otp${i}`).value = '';
        }
        document.getElementById('otp1').focus();
        
        hideOtpError();
        showOtpError('✅ Nuevo código enviado a tu correo');
        setTimeout(() => hideOtpError(), 3000);
        
      } catch (error) {
        console.error('Resend OTP error:', error);
        showOtpError(error.message);
      } finally {
        this.disabled = false;
        this.innerHTML = '<i data-feather="refresh-cw" class="inline w-4 h-4"></i> ¿No recibiste el código? Reenviar';
        feather.replace();
      }
    });

    // Register form
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const password = document.getElementById('reg_password').value;
      const passwordConfirm = document.getElementById('reg_password_confirm').value;
      const messageDiv = document.getElementById('registerMessage');
      const matchError = document.getElementById('passwordMatchError');
      
      messageDiv.textContent = '';
      matchError.classList.add('hidden');

      // Validate password match
      if (password !== passwordConfirm) {
        matchError.classList.remove('hidden');
        messageDiv.className = 'text-red-500 text-sm mt-2 text-center';
        messageDiv.textContent = '❌ Las contraseñas no coinciden';
        return;
      }

      const formData = {
        e_mail: document.getElementById('reg_email_unal').value,
        password: password,
        type_user: 'guest', // Siempre invitado para registro público
        email_unal: document.getElementById('reg_email_unal').value,
        document: document.getElementById('reg_document').value || null,
        name: document.getElementById('reg_name').value || null,
        lastname: document.getElementById('reg_lastname').value || null,
        full_name: document.getElementById('reg_full_name').value || null,
        gender: document.getElementById('reg_gender').value || null,
        birth_date: document.getElementById('reg_birth_date').value || null
      };
      
      // Obtener contactos del manager
      const contacts = registerContactManager.getContacts();

      try {
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-feather="loader" class="h-5 w-5 animate-spin"></i> Registrando...';
        feather.replace();

        // 1. Register in Auth service
        const authResponse = await fetch(`${AUTH_API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            e_mail: formData.e_mail,
            password: formData.password,
            type_user: formData.type_user
          })
        });

        if (!authResponse.ok) {
          const error = await authResponse.json();
          throw new Error(error.detail || 'Error en registro de autenticación');
        }

        // 2. Register in Users service
        const usersResponse = await fetch(`${USERS_API}/users_unal/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email_unal: formData.email_unal,
            document: formData.document,
            name: formData.name,
            lastname: formData.lastname,
            full_name: formData.full_name,
            gender: formData.gender,
            birth_date: formData.birth_date
          })
        });

        if (!usersResponse.ok) {
          const error = await usersResponse.json();
          throw new Error(error.detail || 'Error en registro de usuario');
        }

        // 3. Create contact data if provided (array of contacts)
        if (contacts.length > 0) {
          const contactsWithEmail = contacts.map(c => ({
            ...c,
            email_unal: formData.email_unal
          }));
          
          const contactResponse = await fetch(`${CONTACTS_API}/bulk`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(contactsWithEmail)
          });

          if (!contactResponse.ok) {
            console.warn('Warning: Contact data not saved, but user was created');
          }
        }

        // Success
        messageDiv.className = 'text-green-600 text-sm mt-2 text-center';
        messageDiv.textContent = '✅ Usuario registrado exitosamente. Puedes iniciar sesión ahora.';
        
        document.getElementById('registerForm').reset();
        registerContactManager.clear();
        registerContactManager.addContact(); // Agregar uno vacío de nuevo
        
        // Switch to login tab after 2 seconds
        setTimeout(() => {
          tabLogin.click();
        }, 2000);

      } catch (error) {
        console.error('Error:', error);
        messageDiv.className = 'text-red-500 text-sm mt-2 text-center';
        messageDiv.textContent = '❌ ' + error.message;
      } finally {
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-feather="save" class="h-5 w-5"></i><span>Registrarse</span>';
        feather.replace();
      }
    });

    // Real-time password match validation
    document.getElementById('reg_password_confirm').addEventListener('input', function() {
      const password = document.getElementById('reg_password').value;
      const passwordConfirm = this.value;
      const matchError = document.getElementById('passwordMatchError');
      
      if (passwordConfirm && password !== passwordConfirm) {
        matchError.classList.remove('hidden');
      } else {
        matchError.classList.add('hidden');
      }
    });

    // Inicializar iconos
    feather.replace();

    // Renderizar footer
    const footer = new Footer();
    footer.renderMinimal('footer-container');
  </script>
</body>

</html>
