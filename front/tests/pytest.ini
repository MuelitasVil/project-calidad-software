[pytest]
# Pytest configuration for frontend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = unit-tests integration-tests end-to-end-tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints and database verification
    end_to_end: End-to-end tests for complete UI flows with Selenium
    slow: Tests that take a long time to run

# Timeout (in seconds) - prevents hanging tests
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
