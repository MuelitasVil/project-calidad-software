<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - ORGSECURE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Profile Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center">
                    <i data-feather="user" class="w-10 h-10 text-blue-600"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-800" id="profileName">Cargando...</h1>
                    <p class="text-gray-600" id="profileEmail">email@example.com</p>
                    <span id="profileRole" class="inline-flex items-center gap-1 bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium mt-2">
                        <i data-feather="shield" class="h-4 w-4"></i>
                        <span>Usuario</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Profile Information -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Información del Perfil</h2>
                <button id="editProfileBtn" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                    <i data-feather="edit-2" class="h-4 w-4"></i>
                    <span>Editar</span>
                </button>
            </div>

            <form id="profileForm" class="space-y-4">
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i data-feather="mail" class="inline h-4 w-4"></i>
                        Correo Electrónico
                    </label>
                    <input type="email" id="inputEmail" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="usuario@example.com" disabled>
                </div>

                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i data-feather="user" class="inline h-4 w-4"></i>
                        Nombre de Usuario
                    </label>
                    <input type="text" id="inputUsername" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Nombre completo" disabled>
                </div>

                <!-- Rol (read-only) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i data-feather="shield" class="inline h-4 w-4"></i>
                        Rol
                    </label>
                    <input type="text" id="inputRole" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md bg-gray-100"
                           disabled readonly>
                </div>

                <!-- Action Buttons (hidden by default) -->
                <div id="actionButtons" class="hidden flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                        <i data-feather="save" class="h-4 w-4"></i>
                        <span>Guardar Cambios</span>
                    </button>
                    <button type="button" id="cancelBtn" class="flex-1 bg-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-400 transition-colors flex items-center justify-center gap-2">
                        <i data-feather="x" class="h-4 w-4"></i>
                        <span>Cancelar</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Personal Information Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mt-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Información Personal</h2>
                <button id="editPersonalBtn" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                    <i data-feather="edit-2" class="h-4 w-4"></i>
                    <span>Editar</span>
                </button>
            </div>

            <form id="personalForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Document -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i data-feather="credit-card" class="inline h-4 w-4"></i>
                            Documento de Identidad
                        </label>
                        <input type="text" id="inputDocument" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="1234567890" disabled>
                    </div>

                    <!-- Gender -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i data-feather="users" class="inline h-4 w-4"></i>
                            Género
                        </label>
                        <select id="inputGender" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                disabled>
                            <option value="">Seleccionar</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Otro</option>
                        </select>
                    </div>

                    <!-- Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i data-feather="user" class="inline h-4 w-4"></i>
                            Nombre
                        </label>
                        <input type="text" id="inputName" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Juan" disabled>
                    </div>

                    <!-- Lastname -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i data-feather="user" class="inline h-4 w-4"></i>
                            Apellido
                        </label>
                        <input type="text" id="inputLastname" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Pérez" disabled>
                    </div>

                    <!-- Birth Date -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i data-feather="calendar" class="inline h-4 w-4"></i>
                            Fecha de Nacimiento
                        </label>
                        <input type="date" id="inputBirthDate" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               disabled>
                    </div>

                    <!-- Full Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i data-feather="user-check" class="inline h-4 w-4"></i>
                            Nombre Completo
                        </label>
                        <input type="text" id="inputFullName" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Juan Pérez García" disabled>
                    </div>
                </div>

                <!-- Action Buttons (hidden by default) -->
                <div id="personalActionButtons" class="hidden flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                        <i data-feather="save" class="h-4 w-4"></i>
                        <span>Guardar Cambios</span>
                    </button>
                    <button type="button" id="cancelPersonalBtn" class="flex-1 bg-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-400 transition-colors flex items-center justify-center gap-2">
                        <i data-feather="x" class="h-4 w-4"></i>
                        <span>Cancelar</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Contact Information Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mt-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Datos de Contacto</h2>
                <button id="editContactBtn" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                    <i data-feather="edit-2" class="h-4 w-4"></i>
                    <span>Editar</span>
                </button>
            </div>

            <div id="profileContactsContainer"></div>

            <!-- Action Buttons (hidden by default) -->
            <div id="contactActionButtons" class="hidden flex gap-3 pt-4 mt-4">
                <button type="button" id="saveContactBtn" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                    <i data-feather="save" class="h-4 w-4"></i>
                    <span>Guardar Contactos</span>
                </button>
                <button type="button" id="cancelContactBtn" class="flex-1 bg-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-400 transition-colors flex items-center justify-center gap-2">
                    <i data-feather="x" class="h-4 w-4"></i>
                    <span>Cancelar</span>
                </button>
            </div>
        </div>

        <!-- Change Password Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mt-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Cambiar Contraseña</h2>
                <i data-feather="lock" class="h-6 w-6 text-gray-600"></i>
            </div>

            <form id="passwordForm" class="space-y-4">
                <!-- Current Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i data-feather="key" class="inline h-4 w-4"></i>
                        Contraseña Actual
                    </label>
                    <input type="password" id="currentPassword" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Ingresa tu contraseña actual" required>
                </div>

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i data-feather="lock" class="inline h-4 w-4"></i>
                        Nueva Contraseña
                    </label>
                    <input type="password" id="newPassword" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Ingresa tu nueva contraseña" required>
                </div>

                <!-- Confirm New Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i data-feather="lock" class="inline h-4 w-4"></i>
                        Confirmar Nueva Contraseña
                    </label>
                    <input type="password" id="confirmPassword" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Confirma tu nueva contraseña" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                    <i data-feather="check" class="h-4 w-4"></i>
                    <span>Cambiar Contraseña</span>
                </button>
            </form>
        </div>

        <!-- Additional Info Section -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mt-6">
            <div class="flex items-start gap-2">
                <i data-feather="info" class="h-5 w-5 text-blue-600 mt-0.5"></i>
                <div>
                    <h3 class="font-medium text-blue-900 mb-1">Información</h3>
                    <p class="text-sm text-blue-800">
                        Puedes editar tu información de perfil, datos personales y contactos. Para cambiar tu rol, contacta al administrador.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="js/contact-manager.js"></script>
    <script>
        // APIs
        const USERS_API = 'http://localhost:8001';
        const CONTACTS_API = `${USERS_API}/contact_data`;
        
        // Check authentication
        if (!Navbar.checkAuth()) {
            window.location.href = 'login.html';
        }

        // Load user data
        let userData = {};
        let userPersonalData = {};
        
        try {
            const userStr = localStorage.getItem('user') || '{}';
            userData = JSON.parse(userStr);
        } catch (e) {
            console.error('Error parsing user data:', e);
            userData = { email: 'Usuario', username: 'Usuario', type_user: 'user' };
        }

        // Populate profile header
        document.getElementById('profileName').textContent = userData.username || userData.email || 'Usuario';
        document.getElementById('profileEmail').textContent = userData.email || 'email@example.com';
        document.getElementById('profileRole').querySelector('span').textContent = userData.type_user || 'Usuario';
        
        document.getElementById('inputEmail').value = userData.email || '';
        document.getElementById('inputUsername').value = userData.username || '';
        document.getElementById('inputRole').value = userData.type_user || 'Usuario';

        // Load user personal data from API
        async function loadUserPersonalData() {
            try {
                const response = await fetch(`${USERS_API}/users_unal/${encodeURIComponent(userData.email)}`);
                if (response.ok) {
                    userPersonalData = await response.json();
                    
                    // Populate personal info fields
                    document.getElementById('inputDocument').value = userPersonalData.document || '';
                    document.getElementById('inputName').value = userPersonalData.name || '';
                    document.getElementById('inputLastname').value = userPersonalData.lastname || '';
                    document.getElementById('inputFullName').value = userPersonalData.full_name || '';
                    document.getElementById('inputGender').value = userPersonalData.gender || '';
                    document.getElementById('inputBirthDate').value = userPersonalData.birth_date || '';
                }
            } catch (error) {
                console.error('Error loading personal data:', error);
            }
        }

        // Load personal data on page load
        loadUserPersonalData();

        // Edit mode - Profile
        let isEditMode = false;
        const editBtn = document.getElementById('editProfileBtn');
        const actionButtons = document.getElementById('actionButtons');
        const inputUsername = document.getElementById('inputUsername');
        const cancelBtn = document.getElementById('cancelBtn');

        editBtn.addEventListener('click', () => {
            isEditMode = true;
            inputUsername.disabled = false;
            inputUsername.focus();
            actionButtons.classList.remove('hidden');
            editBtn.classList.add('hidden');
        });

        cancelBtn.addEventListener('click', () => {
            isEditMode = false;
            inputUsername.disabled = true;
            inputUsername.value = userData.username || '';
            actionButtons.classList.add('hidden');
            editBtn.classList.remove('hidden');
        });

        // Form submission
        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newUsername = inputUsername.value.trim();
            if (!newUsername) {
                alert('El nombre de usuario no puede estar vacío');
                return;
            }

            // Update localStorage
            userData.username = newUsername;
            localStorage.setItem('user', JSON.stringify(userData));

            // Update display
            document.getElementById('profileName').textContent = newUsername;

            // Exit edit mode
            isEditMode = false;
            inputUsername.disabled = true;
            actionButtons.classList.add('hidden');
            editBtn.classList.remove('hidden');

            showSuccessMessage('Perfil actualizado correctamente');
        });

        // Edit mode - Personal Information
        let isPersonalEditMode = false;
        const editPersonalBtn = document.getElementById('editPersonalBtn');
        const personalActionButtons = document.getElementById('personalActionButtons');
        const cancelPersonalBtn = document.getElementById('cancelPersonalBtn');
        
        const personalFields = {
            document: document.getElementById('inputDocument'),
            name: document.getElementById('inputName'),
            lastname: document.getElementById('inputLastname'),
            fullName: document.getElementById('inputFullName'),
            gender: document.getElementById('inputGender'),
            birthDate: document.getElementById('inputBirthDate')
        };

        editPersonalBtn.addEventListener('click', () => {
            isPersonalEditMode = true;
            Object.values(personalFields).forEach(field => field.disabled = false);
            personalActionButtons.classList.remove('hidden');
            editPersonalBtn.classList.add('hidden');
        });

        cancelPersonalBtn.addEventListener('click', () => {
            isPersonalEditMode = false;
            
            // Restore original values
            personalFields.document.value = userPersonalData.document || '';
            personalFields.name.value = userPersonalData.name || '';
            personalFields.lastname.value = userPersonalData.lastname || '';
            personalFields.fullName.value = userPersonalData.full_name || '';
            personalFields.gender.value = userPersonalData.gender || '';
            personalFields.birthDate.value = userPersonalData.birth_date || '';
            
            Object.values(personalFields).forEach(field => field.disabled = true);
            personalActionButtons.classList.add('hidden');
            editPersonalBtn.classList.remove('hidden');
        });

        // Personal form submission
        document.getElementById('personalForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const personalData = {
                document: personalFields.document.value || null,
                name: personalFields.name.value || null,
                lastname: personalFields.lastname.value || null,
                full_name: personalFields.fullName.value || null,
                gender: personalFields.gender.value || null,
                birth_date: personalFields.birthDate.value || null
            };

            try {
                const response = await fetch(`${USERS_API}/users_unal/${encodeURIComponent(userData.email)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(personalData)
                });

                if (response.ok) {
                    userPersonalData = await response.json();
                    
                    // Exit edit mode
                    isPersonalEditMode = false;
                    Object.values(personalFields).forEach(field => field.disabled = true);
                    personalActionButtons.classList.add('hidden');
                    editPersonalBtn.classList.remove('hidden');

                    showSuccessMessage('Información personal actualizada correctamente');
                } else {
                    const error = await response.json();
                    showErrorMessage(error.detail || 'Error al actualizar información personal');
                }
            } catch (error) {
                console.error('Error:', error);
                showErrorMessage('Error al actualizar información personal');
            }
        });

        // Password form submission
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showErrorMessage('Las contraseñas nuevas no coinciden');
                return;
            }

            // Validate password length
            if (newPassword.length < 4) {
                showErrorMessage('La contraseña debe tener al menos 4 caracteres');
                return;
            }

            try {
                // First, verify current password by attempting login
                const loginResponse = await fetch('http://localhost:8000/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        e_mail: userData.email,
                        password: currentPassword
                    })
                });

                if (!loginResponse.ok) {
                    showErrorMessage('La contraseña actual es incorrecta');
                    return;
                }

                // Update password
                const updateResponse = await fetch(`http://localhost:8000/auth/user/${userData.email}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        password: newPassword
                    })
                });

                if (!updateResponse.ok) {
                    throw new Error('Error al actualizar la contraseña');
                }

                // Clear form
                document.getElementById('passwordForm').reset();
                showSuccessMessage('Contraseña actualizada correctamente');

            } catch (error) {
                console.error('Error changing password:', error);
                showErrorMessage('Error al cambiar la contraseña. Intenta nuevamente.');
            }
        });

        // Helper functions for messages
        function showSuccessMessage(message) {
            const successMsg = document.createElement('div');
            successMsg.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-md shadow-lg z-50 flex items-center gap-2';
            successMsg.innerHTML = `<i data-feather="check-circle" class="h-4 w-4"></i><span>${message}</span>`;
            document.body.appendChild(successMsg);
            feather.replace();

            setTimeout(() => {
                successMsg.remove();
            }, 3000);
        }

        function showErrorMessage(message) {
            const errorMsg = document.createElement('div');
            errorMsg.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-md shadow-lg z-50 flex items-center gap-2';
            errorMsg.innerHTML = `<i data-feather="x-circle" class="h-4 w-4"></i><span>${message}</span>`;
            document.body.appendChild(errorMsg);
            feather.replace();

            setTimeout(() => {
                errorMsg.remove();
            }, 3000);
        }

        // Contact form handling
        let profileContactManager;
        let isContactEditMode = false;

        // Initialize ContactManager for profile
        profileContactManager = new ContactManager('profileContactsContainer', {
            showLabels: true,
            allowEmpty: true,
            minContacts: 0,
            maxContacts: 10
        });

        const editContactBtn = document.getElementById('editContactBtn');
        const contactActionButtons = document.getElementById('contactActionButtons');
        const cancelContactBtn = document.getElementById('cancelContactBtn');
        const saveContactBtn = document.getElementById('saveContactBtn');

        // Load contact data
        async function loadContactData() {
            try {
                const response = await fetch(`${CONTACTS_API}/user/${encodeURIComponent(userData.email)}`);
                if (response.ok) {
                    const contacts = await response.json();
                    if (contacts.length > 0) {
                        profileContactManager.loadContacts(contacts);
                    } else {
                        // No contacts, add one empty
                        profileContactManager.addContact();
                    }
                    
                    // Disable editing initially
                    disableContactEditing();
                }
            } catch (error) {
                console.error('Error loading contact data:', error);
            }
        }
        
        function disableContactEditing() {
            const container = document.getElementById('profileContactsContainer');
            const inputs = container.querySelectorAll('input');
            const buttons = container.querySelectorAll('button');
            
            inputs.forEach(input => input.disabled = true);
            buttons.forEach(btn => btn.style.display = 'none');
        }
        
        function enableContactEditing() {
            const container = document.getElementById('profileContactsContainer');
            const inputs = container.querySelectorAll('input');
            const buttons = container.querySelectorAll('button');
            
            inputs.forEach(input => input.disabled = false);
            buttons.forEach(btn => btn.style.display = '');
        }

        // Edit contact mode
        editContactBtn.addEventListener('click', () => {
            isContactEditMode = true;
            enableContactEditing();
            contactActionButtons.classList.remove('hidden');
            editContactBtn.classList.add('hidden');
        });

        cancelContactBtn.addEventListener('click', async () => {
            isContactEditMode = false;
            await loadContactData(); // Reload original data
            disableContactEditing();
            contactActionButtons.classList.add('hidden');
            editContactBtn.classList.remove('hidden');
        });

        // Save contacts
        saveContactBtn.addEventListener('click', async () => {
            const contacts = profileContactManager.getContacts();
            
            if (contacts.length === 0) {
                alert('Debes agregar al menos un dato de contacto');
                return;
            }

            try {
                // Use sync endpoint to replace all contacts
                const response = await fetch(`${CONTACTS_API}/user/${encodeURIComponent(userData.email)}/sync`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(contacts)
                });

                if (response.ok) {
                    showSuccessMessage('Datos de contacto actualizados correctamente');
                    await loadContactData();
                    
                    // Exit edit mode
                    isContactEditMode = false;
                    disableContactEditing();
                    contactActionButtons.classList.add('hidden');
                    editContactBtn.classList.remove('hidden');
                } else {
                    const error = await response.json();
                    showErrorMessage(error.detail || 'Error al actualizar datos de contacto');
                }
            } catch (error) {
                console.error('Error:', error);
                showErrorMessage('Error al actualizar datos de contacto');
            }
        });

        // Load contact data on page load
        loadContactData();

        // Initialize components
        const navbar = new Navbar();
        navbar.render('navbar-container', { currentPage: 'profile' });

        const footer = new Footer();
        footer.render('footer-container');

        // Initialize Feather icons
        feather.replace();
    </script>
</body>
</html>
